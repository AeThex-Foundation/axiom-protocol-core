[workspace]
members = [
    "crates/axiom-core",
    "crates/axiom-crypto",
    "crates/axiom-consensus",
    "crates/axiom-state",
    "crates/axiom-network",
    "crates/axiom-sdk",
    "crates/axiom-integration-tests",
]
resolver = "2"

[workspace.package]
version    = "0.1.0"
edition    = "2021"
authors    = ["AeThex Foundation <core@aethex.foundation>"]
license    = "Apache-2.0"
repository = "https://git.aethex.tech/AeThex-Foundation/axiom-protocol-core"
homepage   = "https://aethex.tech"
keywords   = ["blockchain", "consensus", "protocol", "cryptography", "bft"]
categories = ["cryptography", "network-programming"]
rust-version = "1.75"

[workspace.dependencies]
# Cryptography
sha2          = "0.10"
sha3          = "0.10"
blake3        = "1"
ed25519-dalek = { version = "2.1", features = ["rand_core"] }
rand          = "0.8"
rand_core     = "0.6"
hex           = "0.4"
bs58          = "0.5"
zeroize       = { version = "1.7", features = ["derive"] }

# Serialization
serde       = { version = "1", features = ["derive"] }
serde_json  = "1"
bincode     = "1"

# Async / networking
tokio       = { version = "1", features = ["full"] }
tokio-util  = { version = "0.7", features = ["codec"] }
bytes       = "1"
futures     = "0.3"
async-trait = "0.1"

# Utilities
thiserror         = "1"
anyhow            = "1"
tracing           = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
parking_lot       = "0.12"

# Internal crates
axiom-core = { package = "aethex-core", version = "0.1.0", path = "crates/axiom-core" }
axiom-crypto    = { package = "aethex-crypto", version = "0.1.0", path = "crates/axiom-crypto" }
axiom-consensus = { package = "aethex-consensus", version = "0.1.0", path = "crates/axiom-consensus" }
axiom-state     = { package = "aethex-state", version = "0.1.0", path = "crates/axiom-state" }
axiom-network   = { package = "aethex-network", version = "0.1.0", path = "crates/axiom-network" }
axiom-sdk       = { version = "0.1.0", path = "crates/axiom-sdk" }

[profile.release]
opt-level     = 3
lto           = "thin"
codegen-units = 1
panic         = "abort"

[profile.dev]
opt-level = 1
